<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3FBFD">
<meta name="description" content="詰めてこない、お水ごくごく。ゆるく声をかけるだけの水分補給リマインダー。">
<title>お水ごくごく</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お水ごくごく">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- iOS: ホーム画面に追加しないと Web Push が使えないため、Safari タブで開いている間だけ表示 -->
<div class="a2hs-banner" id="a2hsBanner" hidden>
  <p class="a2hs-banner__text">
    通知を受け取るには、<b>共有ボタン</b> → <b>「ホーム画面に追加」</b>してね
  </p>
  <button class="a2hs-banner__close" id="a2hsClose" type="button" aria-label="閉じる">×</button>
</div>

<main class="screen">

  <header class="header">
    <p class="header__date" id="headerDate">今日</p>
    <p class="header__greeting" id="headerGreeting">やっほ</p>
  </header>

  <section class="gauge" id="gauge" aria-label="今日の水分摂取">
    <svg class="gauge__svg" viewBox="0 0 220 220" role="img" aria-hidden="true">
      <defs>
        <linearGradient id="gaugeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7FDBFF"/>
          <stop offset="100%" stop-color="#3AA8D8"/>
        </linearGradient>
      </defs>
      <circle class="gauge__track" cx="110" cy="110" r="96"/>
      <circle class="gauge__value" id="gaugeValue" cx="110" cy="110" r="96"/>
    </svg>
    <div class="gauge__inner">
      <span class="gauge__face" id="gaugeFace">💧</span>
      <span class="gauge__percent" id="gaugePercent">0%</span>
    </div>
  </section>

  <p class="amount">
    <button class="amount__edit" id="amountEdit" type="button" aria-label="目標量を変更">
      <span id="amountCurrent">0</span><span class="amount__sep"> / </span><span id="amountGoal">2,000</span> ml
    </button>
  </p>

  <div class="cta-wrap">
    <button class="cta" id="drinkBtn" type="button">
      <span class="cta__icon" aria-hidden="true">💧</span>
      <span class="cta__label">飲んだ！</span>
    </button>
    <div class="particles" id="particles" aria-hidden="true"></div>
  </div>

  <div class="sub-buttons">
    <button class="sub-btn" data-amount="200" type="button">＋コップ1杯<small>200ml</small></button>
    <button class="sub-btn" data-amount="500" type="button">＋ボトル<small>500ml</small></button>
    <button class="sub-btn" id="customBtn" type="button" aria-expanded="false" aria-controls="customPanel">＋じぶんで<small>すきな量</small></button>
  </div>

  <div class="custom-panel" id="customPanel">
    <div class="custom-panel__inner">
      <label class="custom-panel__label" for="customInput">どのくらい飲んだ？</label>
      <div class="custom-row">
        <input class="custom-input" id="customInput" type="number" inputmode="numeric"
               min="1" max="2000" step="10" placeholder="150" aria-label="飲んだ量（ml）">
        <span class="custom-unit">ml</span>
        <button class="custom-submit" id="customSubmit" type="button">記録</button>
      </div>
      <div class="chips" id="customChips">
        <button class="chip" type="button" data-amount="100">100</button>
        <button class="chip" type="button" data-amount="150">150</button>
        <button class="chip" type="button" data-amount="350">350</button>
        <button class="chip" type="button" data-amount="1000">1000</button>
      </div>
    </div>
  </div>

  <hr class="divider">

  <section class="settings">
    <button class="settings__toggle" id="settingsToggle" type="button" aria-expanded="false" aria-controls="settingsBody">
      <span>🔔 リマインド設定</span>
      <span class="settings__chevron" aria-hidden="true">▾</span>
      <span class="bell-badge" id="bellBadge" hidden>ON</span>
    </button>

    <div class="settings__body" id="settingsBody">
      <div class="settings__inner">

        <p class="settings__label">声をかける時刻</p>
        <ul class="time-list" id="timeList"></ul>
        <button class="link-btn" id="resetTimes" type="button">おすすめの時刻に戻す（9/13/17/20時）</button>

        <p class="settings__label">目標量</p>
        <div class="goal-row">
          <input class="goal-input" id="goalInput" type="number" min="200" max="5000" step="100" inputmode="numeric">
          <span class="goal-unit">ml</span>
        </div>

        <p class="settings__label">通知</p>
        <button class="permit-btn" id="permitBtn" type="button">通知を許可する</button>
        <p class="settings__note" id="permitNote"></p>

      </div>
    </div>
  </section>

  <footer class="footer">
    <p class="footer__streak" id="footerStreak">今日はまだ声かけてないよ 🐣</p>
  </footer>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="messages.js"></script>
<script src="app.js"></script>
</body>
</html>
